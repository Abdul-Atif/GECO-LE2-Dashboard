<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ABEG LE 2 FY2026</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13253a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LE 2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f2f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e3e7ec; --line-2:#cfd6de;
  --ink:#13253a; --ink-2:#4a5a6a; --mute:#7d8a97;
  --acc:#2a78d6; --acc-soft:#e4eefb; --est:#eb6834; --est-soft:#fdeae2; --cmp:#4a3aa7; --cmp-soft:#e9e6f7;
  --good:#006300; --good-fill:#0ca30c; --bad:#b8302f; --bad-fill:#d03b3b;
  --nav-bg:rgba(255,255,255,.92); --shadow:0 1px 2px rgba(19,37,58,.06),0 4px 14px rgba(19,37,58,.06);
  --hero:#13253a; --hero-ink:#ffffff; --hero-mute:#a9b7c6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0f151d; --surface:#171f2a; --surface-2:#1d2735; --line:#26313f; --line-2:#354251;
    --ink:#eef2f6; --ink-2:#b7c2cd; --mute:#8593a1;
    --acc:#3987e5; --acc-soft:#1b2d45; --est:#d95926; --est-soft:#3a251b; --cmp:#9085e9; --cmp-soft:#2a2740;
    --good:#3fc03f; --good-fill:#0ca30c; --bad:#f07070; --bad-fill:#d03b3b;
    --nav-bg:rgba(23,31,42,.94); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --hero:#1d2b3d; --hero-ink:#ffffff; --hero-mute:#a9b7c6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f151d; --surface:#171f2a; --surface-2:#1d2735; --line:#26313f; --line-2:#354251;
  --ink:#eef2f6; --ink-2:#b7c2cd; --mute:#8593a1;
  --acc:#3987e5; --acc-soft:#1b2d45; --est:#d95926; --est-soft:#3a251b; --cmp:#9085e9; --cmp-soft:#2a2740;
  --good:#3fc03f; --good-fill:#0ca30c; --bad:#f07070; --bad-fill:#d03b3b;
  --nav-bg:rgba(23,31,42,.94); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --hero:#1d2b3d; --hero-ink:#ffffff; --hero-mute:#a9b7c6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav-bg);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{padding:10px 16px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.brand .basis{display:block;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap;margin-top:2px}
.a2hs{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--acc);font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:0 1px 2px rgba(19,37,58,.08);flex:0 0 auto}
.a2hs svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.a2hs:active{background:var(--surface-2)}
/* iOS instructions modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(19,37,58,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px 16px 14px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal h3{margin:0 0 6px;font-size:16px;font-weight:600}
.modal p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.modal p b{color:var(--ink);font-weight:600}
.modal .steps{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
.modal .step{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;font-size:13.5px}
.modal .step .n{width:36px;height:36px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.modal .step .n svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal .close{display:block;width:100%;margin-top:12px;padding:11px;border-radius:10px;background:var(--ink);color:var(--surface);font-weight:600;font-size:14px}
@media (min-width:560px){ .modal{align-items:center} }
.pickers{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;flex:1 1 auto;min-width:0}
.seg button{flex:1 1 0;min-width:0;padding:7px 8px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(19,37,58,.12)}
.seg.cmp button[aria-pressed="true"]{color:var(--cmp)}
.seg.cmp button{padding:7px 4px;font-size:12px}
/* content */
main{flex:1;padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
.card .sub{color:var(--mute);font-size:12px;margin:0 0 10px}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.pos{color:var(--good)}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:18px 16px 16px;box-shadow:var(--shadow);border:0}
.hero .eyebrow{color:var(--hero-mute)}
.hero .big{font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.02em;margin:6px 0 2px}
.hero .big small{font-size:16px;font-weight:500;color:var(--hero-mute);letter-spacing:0;margin-left:6px}
.hero .delta{font-size:13px;color:var(--hero-mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.up{background:rgba(12,163,12,.18);color:#8fe28f}
.pill.dn{background:rgba(208,59,59,.2);color:#ffb3b3}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.hero-row .k{font-size:11px;color:var(--hero-mute);letter-spacing:.04em;text-transform:uppercase}
.hero-row .v{font-size:16px;font-weight:600;margin-top:2px}
.hero-row .v small{font-size:11px;font-weight:500;color:var(--hero-mute)}
/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12px;color:var(--ink-2)}
.tile .v{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.tile .v small{font-size:12px;color:var(--mute);font-weight:500;margin-left:3px}
.tile .d{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.tile .d b{font-weight:600}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--line-2);background:var(--surface-2)}
.tbl tr.pct td{color:var(--mute);font-size:12px;padding-top:3px;padding-bottom:5px}
.tbl td .sm{font-size:11px;color:var(--mute);display:block;white-space:normal}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* split bar */
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);gap:2px}
.split span{display:block;height:100%}
.split .a{background:var(--acc)} .split .e{background:var(--est)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.a{background:var(--acc)} .legend i.e{background:var(--est)} .legend i.c{background:var(--cmp);border-radius:50%} .legend i.g{background:var(--mute)}
/* division cards */
.dlist{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.dcard:active{background:var(--surface-2)}
.dcard .n{font-size:15px;font-weight:600}
.dcard .r{font-size:12px;color:var(--ink-2)}
.dcard .np{text-align:right}
.dcard .np .v{font-size:18px;font-weight:600;letter-spacing:-.01em}
.dcard .np .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.dcard .bar{grid-column:1/-1;margin-top:6px}
.divbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.divbar .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.divbar .f{position:absolute;top:0;bottom:0;border-radius:5px}
.divbar .f.pos{background:var(--good-fill)} .divbar .f.neg{background:var(--bad-fill)}
.chev{color:var(--mute);font-size:18px;line-height:1}
/* chart */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:"IBM Plex Sans",system-ui,sans-serif;fill:var(--mute);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .bar.a{fill:var(--acc)} .chart .bar.e{fill:var(--est)}
.chart .bar.dim{opacity:.35}
.chart .cmpl{stroke:var(--cmp);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--cmp);stroke:var(--surface);stroke-width:2}
.chart .hit{fill:transparent}
.chart .lbl{fill:var(--ink-2);font-weight:600;font-size:10px}
.chart .dl{fill:var(--ink);font-size:9.5px;font-weight:500;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.chart .cum{stroke:var(--acc);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .cumarea{fill:var(--acc);opacity:.1}
.chart .cumdot{fill:var(--acc);stroke:var(--surface);stroke-width:2}
.chart .cumdot.e{fill:var(--est)}
.detail{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);display:grid;grid-template-columns:1fr auto auto auto;gap:2px 12px;font-size:12.5px;align-items:baseline}
.detail .k{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.detail .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.detail .m{font-weight:600;font-size:14px}
.detail .tag{font-size:11px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.sel{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 32px 8px 12px;flex:1 1 auto;min-width:0;max-width:100%;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* scenario cards */
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.case .k{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.case .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.case .v{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.case .v small{font-size:11px;color:var(--mute);font-weight:500;margin-left:3px}
.case .s{font-size:12px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.case.base{border-color:var(--acc)}
.range{position:relative;height:56px;margin:6px 0 2px}
.range .track{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:3px;background:var(--surface-2)}
.range .span{position:absolute;top:26px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bad-fill),var(--good-fill))}
.range .zero{position:absolute;top:20px;width:1px;height:18px;background:var(--line-2)}
.range .mk{position:absolute;top:22px;width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);transform:translateX(-50%);background:var(--ink)}
.range .mk.base{background:var(--acc)} .range .mk.ml{background:var(--ink)}
.range .lb{position:absolute;font-size:11px;color:var(--mute);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.range .lb.top{top:0} .range .lb.bot{top:40px}
.range .lb b{color:var(--ink);font-weight:600}
/* backlog */
.bkrow{display:grid;grid-template-columns:96px 1fr auto;gap:8px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bkrow:last-child{border-bottom:0}
.bkrow .n{font-size:13px;font-weight:600}
.bkrow .n small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.bkrow .v{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.bkrow .v small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stack .d{background:var(--acc)} .stack .b{background:var(--est)}
/* register */
.rlist{display:flex;flex-direction:column}
.ritem{border-bottom:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;width:100%}
.ritem:last-child{border-bottom:0}
.ritem .t{font-weight:600;font-size:13.5px}
.ritem .p{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ritem .meta{font-size:11px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.ritem .imp{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;align-self:start}
.ritem .imp small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.ritem .more{grid-column:1/-1;margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 8px}
.ritem .more .k{color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.ritem .more .v{font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.tag.opp{background:rgba(12,163,12,.14);color:var(--good)} .tag.risk{background:rgba(208,59,59,.14);color:var(--bad)}
.tag.ex{background:var(--surface-2);color:var(--mute)}
.lock{position:fixed;inset:0;z-index:70;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.lock-ic{width:56px;height:56px;border-radius:14px;background:var(--hero);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.lock-box h2{margin:0;font-size:18px;font-weight:600}
.lock-box p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.lock-box input[type=password]{font:inherit;font-size:16px;padding:12px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);width:100%;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.lock-rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.lock-go{margin-top:4px;padding:12px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px}
.lock-go[disabled]{opacity:.6}
.lock-err{font-size:12.5px;color:var(--bad);line-height:1.45}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.note b{color:var(--ink-2);font-weight:600}
.linkbtn{color:var(--acc);font-weight:600;font-size:13px;padding:8px 0}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav-bg);backdrop-filter:saturate(1.4) blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;border-radius:10px;color:var(--mute);font-size:10.5px;font-weight:500;letter-spacing:.01em}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--acc);font-weight:600}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--ground);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:640px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-hdr{position:sticky;top:0;background:var(--nav-bg);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin:0 -16px 12px;padding-left:16px;padding-right:16px;z-index:2}
.sheet-hdr h2{margin:0;font-size:17px;font-weight:600;flex:1}
.sheet-hdr .sub2{font-size:12px;color:var(--mute);font-weight:400}
.back{display:flex;align-items:center;gap:4px;color:var(--acc);font-weight:600;font-size:14px;padding:6px 6px 6px 0}
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.pitem:last-child{border-bottom:0}
.pitem > div:first-child{min-width:0}
.pitem .v{white-space:nowrap}
.pitem .n{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .w{font-size:11px;color:var(--mute)}
.pitem .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.pitem .v small{display:block;font-weight:400;color:var(--mute);font-size:11px}
@media (min-width:560px){ .tiles{grid-template-columns:repeat(4,1fr)} .cases{grid-template-columns:repeat(4,1fr)} }
/* ---------- desktop / tablet landscape ---------- */
@media (min-width:960px){
  .app{max-width:none;margin:0;padding-left:212px}
  .hdr-in{flex-direction:row;align-items:center;justify-content:space-between;max-width:1240px;margin:0 auto;padding:12px 28px}
  .pickers{flex:0 1 auto;flex-wrap:nowrap}
  .seg{flex:0 0 auto} .seg button{flex:0 0 auto;overflow:visible;padding:7px 14px} .seg.cmp button{padding:7px 12px}
  main{max-width:1296px;margin:0 auto;padding:20px 28px 40px;width:100%}
  .view{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
  .view > *{grid-column:1/-1;min-width:0}
  .view > .g5{grid-column:span 5} .view > .g6{grid-column:span 6} .view > .g7{grid-column:span 7} .view > .g12{grid-column:1/-1}
  .view > .o1{order:1} .view > .o2{order:2} .view > .o3{order:3} .view > .o4{order:4} .view > .o5{order:5} .view > .o6{order:6} .view > .o7{order:7}
  .view > .kaseChips{order:0}
  #v-sum > p.note{order:3}
  #v-sum .tiles{grid-template-columns:repeat(2,1fr);align-self:stretch;grid-auto-rows:1fr}
  .hero .big{font-size:56px}
  .dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .cases{grid-template-columns:repeat(4,1fr)}
  /* left rail navigation */
  .nav{top:0;bottom:0;right:auto;width:212px;border-top:0;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px}
  .nav-in{display:flex;flex-direction:column;gap:4px;max-width:none}
  .nav-in::before{content:'ABEG \00b7 FY2026';display:block;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:6px 12px 14px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:14px;border-radius:10px}
  .nav button[aria-current="page"]{background:var(--acc-soft)}
  /* sheet becomes a centred panel */
  .sheet{background:rgba(19,37,58,.45);padding:28px 0}
  .sheet-in{max-width:1000px;background:var(--ground);border-radius:18px;padding:0 24px 28px;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden}
  .sheet-hdr{margin:0 -24px 16px;padding-left:24px;padding-right:24px;border-radius:18px 18px 0 0}
  .sheet .view{display:grid}
  .sheet .view > .hero{grid-column:span 5} .sheet .view > .card:nth-of-type(1){grid-column:span 7}
  .modal{align-items:center}
}
@media (min-width:1500px){ .app{padding-left:232px} .nav{width:232px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<script>
window.__bootLE2 = function(){
'use strict';
var D = window.LE2;
var MON = D.meta.months, NA = D.meta.actual_months;
var E = {}; D.ents.forEach(function(e){ E[e.id] = e; });
var CUR = D.meta.cur_short || 'LE 2', CUR_LONG = D.meta.cur_long || 'LE 2 (7+5)', CUR_DESC = D.meta.cur_desc || '';
D.ents.forEach(function(e){ if (!e.cur) e.cur = e.le2; if (!e.fzc) e.fzc = e.cases; });   // pure LE 2 build: current = LE 2, comparator cases = its own cases
var A0 = MON[0], AL = MON[NA-1], F0 = MON[NA];   // actual window / first forecast month
var NUMW = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve'];
function cmpL(e){ var c=state.cmp; if (c==='fz') return state.kase==='base' ? e.fz : (e.fzc[state.kase]||e.fz); return e[c]; }
function cmpFz(e,K){ return K==='base' ? e.fz : (e.fzc[K]||e.fz); }
function cmpHead(){ var c=state.cmp; return CMP_NAME[c] + (c==='fz' && state.kase!=='base' ? ' '+KASE_NAME[state.kase] : ''); }
var CMP_NAME = {fz:'LE 2', le1:'LE 1', bud:'Budget', ly:'FY 2025'};
var CMP_LONG = {fz:(D.meta.fz_label||'LE 2 (7+5)')+' frozen '+(D.meta.fz_on||''), le1:'LE 1 (3+9)', bud:'Budget FY2026', ly:'FY 2025 actual'};
var CASES = [['worst','Worst'],['base','Base'],['ml','Most likely'],['best','Best']];
var CASE_COL = {base:'var(--acc)', ml:'var(--ink)', best:'var(--good-fill)', worst:'var(--bad-fill)'};
var state = {ent:'grp', cmp:'le1', view:'sum', kase:'ml', monEnt:'', metric:'rev', cum:false, selMonth:null, roType:'all', roDiv:'all', roSort:'ml', roOpen:null, roShow:25};
try { var s = JSON.parse(localStorage.getItem('le2m3') || '{}'); ['ent','cmp','metric','kase','monEnt'].forEach(function(k){ if (s[k] !== undefined) state[k] = s[k]; }); } catch(e){}
function save(){ try { localStorage.setItem('le2m3', JSON.stringify({ent:state.ent,cmp:state.cmp,metric:state.metric,kase:state.kase,monEnt:state.monEnt})); } catch(e){} }

/* ---------- formatting ---------- */
function sum(a){ var t=0; for (var i=0;i<a.length;i++) t+=a[i]; return t; }
function fmtM(v, dp){ // AED millions, finance style (negatives in brackets)
  if (v === null || v === undefined || isNaN(v)) return '—';
  var m = v/1e6, a = Math.abs(m);
  if (dp === undefined) dp = a >= 100 ? 1 : (a >= 10 ? 1 : 2);
  var s = a.toLocaleString('en-US', {minimumFractionDigits:dp, maximumFractionDigits:dp});
  return m < 0 ? '(' + s + ')' : s;
}
function fmtS(v, dp){ // signed variance
  if (v === null || v === undefined || isNaN(v)) return '—';
  var m=v/1e6, a=Math.abs(m); if (dp===undefined) dp = a>=10?1:2;
  var s=a.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
  return (m<0?'−':'+')+s;
}
function pct(n,d){ if (!d) return '—'; return (100*n/d).toFixed(1)+'%'; }
function pctS(n,d,dp){ if (!d) return '—'; var p=100*n/d; return (p<0?'−':'+')+Math.abs(p).toFixed(dp===undefined?0:dp)+'%'; }
function cls(v){ return v>0?'pos':(v<0?'neg':''); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function el(id){ return document.getElementById(id); }
function ent(){ return E[state.ent]; }
function lineTot(e, basis, k){ var a = e[basis] && e[basis][k]; return a ? sum(a) : null; }
var KASE_NAME = {base:'Base', ml:'Most likely', best:'Best', worst:'Worst'};
function caseLines(e, kase){ return (!kase || kase==='base') ? e.cur : e.cases[kase]; }
function caseTot(e, kase, k){ var a = caseLines(e,kase)[k]; return a ? sum(a) : 0; }

/* ---------- P&L table ---------- */
var PL = [['rev','Revenue',false,1],['cos','Cost of sales',false,1],['gp','Gross profit',true,1],['gp%'],['oh','Divisional overhead',false,1],['cp','Contribution',true,1],['sga','SG&A',false,1],['misc','Misc. income',false,2],['fin','Finance cost (register)',false,2],['npbt','NPBT',true,2],['ct','Corporate tax 9%',false,2],['npat','NPAT',true,2]];

    +'<div class="imp '+cls(r.nM)+'">'+fmtS(r.nM,2)+'<small>most likely</small></div>'
    +(open?'<div class="more"><div><div class="k">Best</div><div class="v '+cls(r.nB)+'">'+fmtS(r.nB,2)+'</div></div><div><div class="k">Most likely</div><div class="v '+cls(r.nM)+'">'+fmtS(r.nM,2)+'</div></div><div><div class="k">Worst</div><div class="v '+cls(r.nW)+'">'+fmtS(r.nW,2)+'</div></div><div><div class="k">Gross impact</div><div class="v">'+fmtM(r.imp,2)+'</div></div><div><div class="k">Basis</div><div class="v">'+esc(r.basis)+'</div></div><div><div class="k">Owner · Ref</div><div class="v">'+esc(r.owner)+' · '+esc(r.ref)+'</div></div></div>':'')+'</button>';
}

/* ---------- install (add to home screen) ---------- */
var a2hsBtn = el('a2hsBtn'), a2hsModal = el('a2hsModal'), installEv = null;
var UA = navigator.userAgent || '';
var isIOS = /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && 'ontouchend' in document);
var isAndroid = /android/i.test(UA);
var isSamsung = /SamsungBrowser/i.test(UA);
var isMobile = isIOS || isAndroid || /mobile/i.test(UA);
var framed = (function(){ try { return window.top !== window; } catch(e){ return true; } })();
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function showA2HS(show){ a2hsBtn.hidden = !show || isStandalone(); }
// Chromium browsers tell us when the page can be installed as an app
window.addEventListener('beforeinstallprompt', function(ev){ ev.preventDefault(); installEv = ev; showA2HS(true); });
window.addEventListener('appinstalled', function(){ installEv = null; showA2HS(false); });
// Phones and tablets: always offer the button unless already on the home screen.
// Where the browser gives an install prompt we use it; otherwise the button opens the steps for that browser.
if (isMobile && !isStandalone()) showA2HS(true);
if (window.matchMedia) { try { window.matchMedia('(display-mode: standalone)').addEventListener('change', function(){ showA2HS(!a2hsBtn.hidden); }); } catch(e){} }
a2hsBtn.addEventListener('click', function(){
  if (installEv) {
    var ev = installEv; installEv = null;
    ev.prompt();
    ev.userChoice.then(function(){ showA2HS(false); }, function(){ showA2HS(false); });
    return;
  }
  openA2HSModal();
});
var ICO = {
  share: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
  dots:  '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg>',
  lines: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  plus:  '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
  tick:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>'
};
function step(ico, html){ return '<div class="step"><div class="n">'+ico+'</div><div>'+html+'</div></div>'; }
function openA2HSModal(){
  var lead, steps;
  if (isIOS) {
    lead = 'Tap the <b>Share</b> icon, then <b>\u2018Add to Home Screen\u2019</b>.';
    steps = step(ICO.share, 'Tap <b>Share</b> \u2014 the square with an arrow at the bottom of Safari') + step(ICO.plus, 'Scroll the list and tap <b>Add to Home Screen</b>') + step(ICO.tick, 'Tap <b>Add</b> in the top-right corner');
  } else if (isSamsung) {
    lead = 'Open the <b>Samsung Internet menu</b>, then <b>\u2018Add page to\u2019</b> \u2192 <b>\u2018Home screen\u2019</b>.';
    steps = step(ICO.lines, 'Tap the <b>menu</b> \u2014 the three lines at the bottom-right') + step(ICO.plus, 'Tap <b>Add page to</b>, then <b>Home screen</b>') + step(ICO.tick, 'Tap <b>Add</b>');
  } else if (isAndroid) {
    lead = 'Open the <b>browser menu</b>, then <b>\u2018Add to Home screen\u2019</b>.';
    steps = step(ICO.dots, 'Tap the <b>\u22ee menu</b> at the top-right of Chrome') + step(ICO.plus, 'Tap <b>Add to Home screen</b> (or <b>Install app</b>)') + step(ICO.tick, 'Tap <b>Add</b>');
  } else {
    lead = 'Open your browser\u2019s menu and choose <b>Install</b> or <b>Add to Home screen</b>.';
    steps = step(ICO.dots, 'Open the browser <b>menu</b>') + step(ICO.plus, 'Choose <b>Install</b> or <b>Add to Home screen</b>') + step(ICO.tick, 'Confirm');
  }
  var note = framed ? '<p style="margin-top:10px;font-size:12px">Opened inside another app? Use its <b>Open in browser</b> option first, so this page has its own browser tab \u2014 then follow the steps.</p>' : '';
  a2hsModal.innerHTML = '<div class="box"><h3 id="a2hsTitle">Add to Home Screen</h3><p>'+lead+' The dashboard then opens from its own icon.</p><div class="steps">'+steps+'</div>'+note+'<button class="close" id="a2hsClose">Got it</button></div>';
  a2hsModal.hidden = false;
  el('a2hsClose').addEventListener('click', closeA2HSModal);
  el('a2hsClose').focus();
}
function closeA2HSModal(){ a2hsModal.hidden = true; a2hsModal.innerHTML = ''; a2hsBtn.focus(); }
a2hsModal.addEventListener('click', function(ev){ if (ev.target === a2hsModal) closeA2HSModal(); });
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && !a2hsModal.hidden) closeA2HSModal(); });

/* ---------- routing ---------- */
var RENDER={sum:renderSummary,div:renderDivisions,mon:renderMonths,sc:renderScenarios,bl:renderBacklog,ro:renderRO};
function show(v){ state.view=v; save(); ['sum','div','mon','sc','bl','ro'].forEach(function(k){ el('v-'+k).hidden = k!==v; }); document.querySelectorAll('#nav button').forEach(function(b){ if (b.getAttribute('data-v')===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); RENDER[v](); window.scrollTo(0,0); }
function renderAll(){ RENDER[state.view](); }
document.querySelectorAll('#nav button').forEach(function(b){ b.addEventListener('click', function(){ show(b.getAttribute('data-v')); }); });
el('entSeg').querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ state.ent=b.getAttribute('data-ent'); state.selMonth=null; state.roDiv='all'; state.roShow=25; syncPickers(); save(); renderAll(); }); });
el('cmpSeg').querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ state.cmp=b.getAttribute('data-cmp'); syncPickers(); save(); renderAll(); }); });
function syncPickers(){ el('entSeg').querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-ent')===state.ent); }); el('cmpSeg').querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-cmp')===state.cmp); }); }
document.addEventListener('click', function(ev){ var t=ev.target.closest('[data-go]'); if (t){ show(t.getAttribute('data-go')); return; } var o=ev.target.closest('#main [data-open]'); if (o){ openSheet(o.getAttribute('data-open')); } });
document.addEventListener('keydown', function(ev){ if (ev.key==='Escape' && !el('sheet').hidden) closeSheet(); });
el('basisChip').textContent = D.meta.basis+' \u00b7 '+A0+'\u2013'+AL+' actual';
syncPickers(); show(state.view);
};
if (window.LE2) window.__bootLE2();
</script>

/* Service worker: registered on every load, locked or open, so updates are picked up from the lock screen too */
if ('serviceWorker' in navigator && window.top === window) { try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){} }

<script>
/* Locked build: the payload is AES-256-GCM ciphertext; the key comes from the passphrase via PBKDF2-SHA256. */
(function(){
  var ENC = window.LE2_ENC; if (!ENC || window.LE2) return;
  window.LE2_LOCKED = true;
  var lock = document.getElementById('lock'), form = document.getElementById('lockForm'), err = document.getElementById('lockErr'), go = document.getElementById('lockGo');
  var b64 = function(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
  var toB64 = function(u){ var s=''; for (var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
  var subtle = window.crypto && window.crypto.subtle;
  function normalise(p){ return p.trim().replace(/\s+/g,'').toUpperCase(); }
  function deriveKey(pass){
    return subtle.importKey('raw', new TextEncoder().encode(normalise(pass)), 'PBKDF2', false, ['deriveKey']).then(function(km){
      return subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, true, ['decrypt']);
    });
  }
  function openWith(key){
    return subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct)).then(function(buf){
      window.LE2 = JSON.parse(new TextDecoder().decode(buf));
      lock.hidden = true; window.__bootLE2(); return key;
    });
  }
  function start(){
    if (!subtle) { lock.hidden=false; err.textContent='This browser cannot open the protected dashboard. Please use Chrome, Edge, Samsung Internet or Safari over https.'; err.hidden=false; go.disabled=true; return; }
    var saved = null; try { saved = localStorage.getItem('le2m_key'); } catch(e){}
    if (saved) {
      subtle.importKey('raw', b64(saved), {name:'AES-GCM'}, true, ['decrypt']).then(openWith).catch(function(){ try { localStorage.removeItem('le2m_key'); } catch(e){} lock.hidden=false; });
    } else lock.hidden = false;
  }
  form.addEventListener('submit', function(ev){
    ev.preventDefault(); err.hidden = true; go.disabled = true; go.textContent = 'Opening\u2026';
    var pass = document.getElementById('pass').value, remember = document.getElementById('remember').checked;
    deriveKey(pass).then(openWith).then(function(key){
      if (remember) subtle.exportKey('raw', key).then(function(raw){ try { localStorage.setItem('le2m_key', toB64(new Uint8Array(raw))); } catch(e){} });
    }).catch(function(){ err.hidden = false; go.disabled = false; go.textContent = 'Open dashboard'; document.getElementById('pass').select(); });
  });
  start();
})();
</script>
